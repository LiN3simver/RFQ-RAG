# 部署目標與「改了什麼 → 要做什麼」的規則；deploy.sh 與 apply.sh 共用。主機為佔位值。

: "${T_HOST:=deploy@deploy-host.example.internal}"
: "${T_REMOTE:=~/apps/rfq-rag}"

: "${T_SERVICE:=api}"
: "${T_EXTRA_SERVICES:=}"
: "${T_PREBUILD:=}"

: "${T_IMAGE_RE:=^(main\.py|src/|vendor/|requirements(-api|-pipeline)?\.txt|Dockerfile)}"

: "${T_MOUNT_RE:=^data/}"

: "${T_COMPOSE_RE:=^docker-compose\.yml$}"

: "${T_MIGRATION_RE:=}"

: "${T_NOTE_RE:=}"

: "${T_IMAGE_KEEP:=5}"

: "${T_HEALTH_CMD=bash deploy/smoke.sh}"
: "${T_HEALTH_OK_RE:=^SMOKE_OK}"
: "${T_HEALTH_RETRIES:=24}"
: "${T_HEALTH_INTERVAL:=5}"

: "${T_DEPENDENT_RE:=}"
: "${T_DEPENDENT_DIRS:=}"
